[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-budget-gateway"
version = "14.0.0"
description = "LLM budget gateway: OpenAI-compatible proxy with budget enforcement and automatic model fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "litellm==1.94.1",
    "pyyaml==6.0.3",
    "mcp==1.29.0",
    "jsonschema==4.26.0",
    "tzdata==2025.2",
    "cryptography==45.0.7",
]

[project.scripts]
gateway-system = "llm_budget_gateway.system_launcher:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "SIM105"]
